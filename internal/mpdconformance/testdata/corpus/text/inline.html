<p>Use <em>emphasis</em>, <strong>strong text</strong>, and <em><strong>strong emphasis</strong></em> with <code>inline code</code>.</p>
<p>Roles include <mark>marked</mark>, <del>removed</del>, H<sub>2</sub>O, x<sup>n</sup>, and <kbd>Command K</kbd>.</p>
<p>Ship 🚀 with ✨. Unknown :not_an_emoji: and escaped :rocket: remain text. Code <code>:rocket:</code> remains literal.</p>
